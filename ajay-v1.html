<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --ink:#000000;
    --dim:#8e8e93;
    --line:#e5e5ea;
    --blue:#007aff;
    --red:#ff3b30;
    --green:#34c759;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    font-size:15px;
    line-height:1.4;
    padding:28px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}

  header{padding:6px 8px 22px;}
  h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;}
  .sub{color:var(--dim);font-size:14px;margin-top:3px;}

  .segment{
    display:flex;background:#e3e3e8;border-radius:9px;padding:2px;margin-bottom:22px;
  }
  .tab{
    flex:1;text-align:center;padding:6px 0;cursor:pointer;
    font-size:13.5px;font-weight:600;color:var(--dim);border-radius:7px;
    transition:background .15s, color .15s;
  }
  .tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.08);}

  .section{display:none;}
  .section.active{display:block;}

  .card{
    background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden;
  }
  .row{
    padding:13px 15px;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row-label{font-size:11.5px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:7px;}

  input[type=file]{
    width:100%;font-size:13.5px;color:var(--dim);
    border:none;background:transparent;padding:0;font-family:inherit;
  }
  input[type=file]::file-selector-button{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--blue);
    background:#eaf2ff;border:none;border-radius:8px;padding:7px 13px;
    margin-right:11px;cursor:pointer;
  }

  input[type=number]{
    width:100%;padding:0;background:transparent;border:none;color:var(--ink);
    font-family:inherit;font-size:16px;font-weight:500;text-align:right;
  }
  input[type=number]:focus, textarea:focus{outline:none;}
  .row.split{display:flex;align-items:center;justify-content:space-between;}
  .row.split .row-label{margin-bottom:0;}

  textarea{
    width:100%;padding:0;background:transparent;border:none;color:var(--ink);
    font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;
    min-height:70px;resize:vertical;line-height:1.6;
  }
  ::placeholder{color:#c7c7cc;}

  .filename{font-size:12.5px;color:var(--blue);margin-top:6px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row span{font-size:14.5px;}
  .switch{position:relative;width:47px;height:27px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .slider{
    position:absolute;inset:0;background:#e5e5ea;border-radius:27px;cursor:pointer;
    transition:background .2s;
  }
  .slider::before{
    content:'';position:absolute;width:23px;height:23px;left:2px;top:2px;
    background:#fff;border-radius:50%;transition:transform .2s;
    box-shadow:0 3px 1px rgba(0,0,0,0.06),0 3px 8px rgba(0,0,0,0.15);
  }
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider::before{transform:translateX(20px);}

  .partfield{padding:13px 15px;border-top:1px solid var(--line);display:none;}
  .partfield.show{display:block;}

  button.run{
    width:100%;padding:15px;margin-top:4px;background:var(--blue);color:#fff;
    border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:600;
    cursor:pointer;
  }
  button.run:active{opacity:0.75;}
  button.run:disabled{background:#c7c7cc;cursor:not-allowed;}

  .msg{display:none;font-size:13px;margin-top:11px;padding:0 4px;line-height:1.5;color:var(--dim);text-align:center;}
  .msg.show{display:block;}
  .msg.err{color:var(--red);}

  .dl{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 15px;text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;
  }
  .dl svg{flex-shrink:0;}

  .reset{
    display:block;width:100%;margin-top:26px;padding:14px;background:var(--card);
    border:none;border-radius:14px;color:var(--red);font-family:inherit;
    font-size:15px;font-weight:500;cursor:pointer;
  }
  .reset:active{opacity:0.6;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>AJAY</h1>
    <div class="sub">The key stays with you</div>
  </header>

  <div class="segment">
    <div class="tab active" data-t="e">Encrypt</div>
    <div class="tab" data-t="d">Decrypt</div>
  </div>

  <!-- ENCRYPT -->
  <div class="section active" id="sec-e">

    <div class="card">
      <div class="row">
        <div class="row-label">File</div>
        <input type="file" id="e-file">
        <div class="filename" id="e-fname"></div>
      </div>
      <div class="row split">
        <div class="row-label">Positions to scramble</div>
        <input type="number" id="e-count" value="500" min="1">
      </div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <span>Add AJAY header</span>
        <label class="switch">
          <input type="checkbox" id="e-marker" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>Rename output</span>
        <label class="switch">
          <input type="checkbox" id="e-datename">
          <span class="slider"></span>
        </label>
      </div>
      <div class="partfield" id="e-part-wrap">
        <div class="row-label">Part number (DD-MM-YYYY&nbsp;&nbsp;#N)</div>
        <input type="number" id="e-part" value="1" min="1" placeholder="#" style="text-align:left;margin-top:4px;">
      </div>
    </div>

    <button class="run" id="e-run">Encrypt</button>
    <div class="msg" id="e-msg"></div>

    <div class="card" id="e-result" style="display:none;margin-top:18px;">
      <a class="dl" id="e-dl-file" download>
        Encrypted file
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2"><path d="M12 3v13m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      </a>
      <a class="dl" id="e-dl-key" download>
        Key (.txt)
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2"><path d="M12 3v13m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      </a>
    </div>
  </div>

  <!-- DECRYPT -->
  <div class="section" id="sec-d">

    <div class="card">
      <div class="row">
        <div class="row-label">File</div>
        <input type="file" id="d-file">
        <div class="filename" id="d-fname"></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="row-label">Key</div>
        <textarea id="d-key" placeholder="Paste key text"></textarea>
      </div>
      <div class="row">
        <div class="row-label">Or upload key file</div>
        <input type="file" id="d-keyfile" accept=".txt">
      </div>
    </div>

    <button class="run" id="d-run">Decrypt</button>
    <div class="msg" id="d-msg"></div>

    <div class="card" id="d-result" style="display:none;margin-top:18px;">
      <a class="dl" id="d-dl-file" download>
        Restored file
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2.2"><path d="M12 3v13m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      </a>
    </div>
  </div>

  <button class="reset" id="reset">Reset Session</button>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const MARKER = new Uint8Array([0x41,0x4A,0x41,0x59]); // "AJAY"

  const dateNameBox = document.getElementById('e-datename');
  if(dateNameBox){
    dateNameBox.addEventListener('change', ()=>{
      document.getElementById('e-part-wrap').classList.toggle('show', dateNameBox.checked);
    });
  }

  function ddmmyyyy(){
    const d = new Date();
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    return `${dd}-${mm}-${yyyy}`;
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('sec-' + t.dataset.t).classList.add('active');
    });
  });

  function showMsg(el, txt, type){ el.textContent = txt; el.className = 'msg show ' + (type==='err'?'err':''); }
  function clearMsg(el){ el.className = 'msg'; el.textContent = ''; }

  function secureRandInt(max){
    const arr = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    let x;
    do { crypto.getRandomValues(arr); x = arr[0]; } while (x >= limit);
    return x % max;
  }

  // ---------- ENCRYPT ----------
  let eBytes = null, eName = '';
  $('e-file').addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(!f) return;
    eBytes = new Uint8Array(await f.arrayBuffer());
    eName = f.name;
    $('e-fname').textContent = f.name + '  ·  ' + eBytes.length.toLocaleString() + ' bytes';
    $('e-result').style.display = 'none';
  });

  $('e-run').addEventListener('click', ()=>{
    const msg = $('e-msg'); clearMsg(msg);
    if(!eBytes){ showMsg(msg, 'Choose a file first.', 'err'); return; }
    const count = parseInt($('e-count').value);
    if(!count || count < 1){ showMsg(msg, 'Enter a valid count.', 'err'); return; }
    const n = eBytes.length;
    if(count > n){ showMsg(msg, 'Count exceeds file size.', 'err'); return; }

    $('e-run').disabled = true;

    const idx = Array.from({length:n}, (_,i)=>i);
    for(let i=0;i<count;i++){
      const j = i + secureRandInt(n-i);
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    const chosen = idx.slice(0, count);

    const replacePositions = [];
    const deletePositions = [];
    for(const pos of chosen){
      if(secureRandInt(2) === 0) replacePositions.push(pos);
      else deletePositions.push(pos);
    }

    const keyLines = [];
    const out = new Uint8Array(eBytes);

    for(const pos of replacePositions){
      keyLines.push(`${pos},${eBytes[pos].toString(16).padStart(2,'0')},r`);
      out[pos] = secureRandInt(256);
    }
    for(const pos of deletePositions){
      keyLines.push(`${pos},${eBytes[pos].toString(16).padStart(2,'0')},d`);
    }
    const deleteSet = new Set(deletePositions);
    const finalOut = new Uint8Array(out.length - deletePositions.length);
    { let w = 0;
      for(let r=0; r<out.length; r++){
        if(!deleteSet.has(r)) finalOut[w++] = out[r];
      }
    }

    const addMarker = $('e-marker').checked;
    const final = addMarker
      ? (()=>{ const f = new Uint8Array(MARKER.length + finalOut.length); f.set(MARKER,0); f.set(finalOut,MARKER.length); return f; })()
      : finalOut;

    const keyText =
      `AJAY\n` +
      `file: ${eName}\n` +
      `size: ${n}\n` +
      `count: ${chosen.length}\n` +
      `mode: merged\n` +
      `marker: ${addMarker ? 'yes' : 'no'}\n` +
      keyLines.join('\n') + '\n';

    const useDateName = $('e-datename').checked;
    const extMatch = eName.match(/\.[^.]+$/);
    const ext = extMatch ? extMatch[0] : '';
    const outName = useDateName
      ? `${ddmmyyyy()}  #${$('e-part').value || '1'}${ext}`
      : eName;

    const fBlob = new Blob([final], {type:'application/octet-stream'});
    $('e-dl-file').href = URL.createObjectURL(fBlob);
    $('e-dl-file').download = outName;

    const kBlob = new Blob([keyText], {type:'text/plain'});
    $('e-dl-key').href = URL.createObjectURL(kBlob);
    $('e-dl-key').download = outName + '.key.txt';

    $('e-result').style.display = 'block';
    showMsg(msg, `${chosen.length} positions secured (${replacePositions.length} replaced, ${deletePositions.length} deleted). Save the key before you reset.`);
    $('e-run').disabled = false;
  });

  // ---------- DECRYPT ----------
  let dBytes = null, dName = '';
  $('d-file').addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(!f) return;
    dBytes = new Uint8Array(await f.arrayBuffer());
    dName = f.name;
    $('d-fname').textContent = f.name + '  ·  ' + dBytes.length.toLocaleString() + ' bytes';
    $('d-result').style.display = 'none';
  });

  $('d-keyfile').addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(!f) return;
    $('d-key').value = await f.text();
  });

  function parseKey(text){
    const lines = text.split('\n').map(l=>l.trim());
    const pairs = [];
    let mode = 'merged';
    let marker = null;
    for(const line of lines){
      if(line.startsWith('mode:')){ mode = line.slice(5).trim(); continue; }
      if(line.startsWith('marker:')){ marker = line.slice(7).trim(); continue; }
      if(!line || line==='AJAY' || line.startsWith('file:') || line.startsWith('size:') ||
         line.startsWith('count:') || line.startsWith('kdf:') || line.startsWith('key:')) continue;
      const parts = line.split(',').map(s=>s.trim());
      const posStr = parts[0], hexStr = parts[1];
      const typeStr = parts[2] || (mode === 'delete' ? 'd' : 'r');
      const pos = parseInt(posStr,10);
      const val = parseInt(hexStr,16);
      if(Number.isNaN(pos) || Number.isNaN(val)) throw new Error('Bad line: '+line);
      pairs.push({position:pos, value:val, type: typeStr === 'd' ? 'd' : 'r'});
    }
    return {pairs, mode, marker};
  }

  $('d-run').addEventListener('click', ()=>{
    const msg = $('d-msg'); clearMsg(msg);
    if(!dBytes){ showMsg(msg,'Choose a file first.','err'); return; }
    const keyText = $('d-key').value.trim();
    if(!keyText){ showMsg(msg,'Paste or upload the key.','err'); return; }

    let pairs, mode, marker;
    try{ ({pairs, mode, marker} = parseKey(keyText)); }
    catch(err){ showMsg(msg,'Bad key data — '+err.message,'err'); return; }
    if(pairs.length===0){ showMsg(msg,'No position,value lines found.','err'); return; }

    $('d-run').disabled = true;
    showMsg(msg, 'Decrypting…');

    let bytes = dBytes;
    const looksMarked = bytes.length >= 4 && bytes[0]===0x41 && bytes[1]===0x4A && bytes[2]===0x41 && bytes[3]===0x59;
    if(marker === 'yes' || (marker === null && looksMarked)){
      bytes = bytes.slice(4);
    }

    let out, bad = false;

    if(mode === 'merged'){
      const deletePairs = pairs.filter(p=>p.type==='d').slice().sort((a,b)=>a.position-b.position);
      const replacePairs = pairs.filter(p=>p.type==='r');
      out = new Uint8Array(bytes.length + deletePairs.length);
      { let src = 0, w = 0;
        for(const p of deletePairs){
          if(p.position < 0 || p.position > out.length){ bad = true; continue; }
          const take = p.position - w;
          if(take < 0 || src + take > bytes.length){ bad = true; continue; }
          out.set(bytes.subarray(src, src+take), w);
          w += take; src += take;
          out[w++] = p.value;
        }
        if(src <= bytes.length) out.set(bytes.subarray(src), w);
      }
      for(const p of replacePairs){
        if(p.position<0 || p.position>=out.length){ bad = true; continue; }
        out[p.position] = p.value;
      }
    } else if(mode === 'delete'){
      const rebuildOrder = pairs.slice().sort((a,b)=>a.position-b.position);
      out = new Uint8Array(bytes.length + rebuildOrder.length);
      { let src = 0, w = 0;
        for(const p of rebuildOrder){
          if(p.position < 0 || p.position > out.length){ bad = true; continue; }
          const take = p.position - w;
          if(take < 0 || src + take > bytes.length){ bad = true; continue; }
          out.set(bytes.subarray(src, src+take), w);
          w += take; src += take;
          out[w++] = p.value;
        }
        if(src <= bytes.length) out.set(bytes.subarray(src), w);
      }
    } else {
      out = new Uint8Array(bytes);
      for(const p of pairs){
        if(p.position<0 || p.position>=out.length){ bad = true; continue; }
        out[p.position] = p.value;
      }
    }

    const blob = new Blob([out], {type:'application/octet-stream'});
    $('d-dl-file').href = URL.createObjectURL(blob);
    $('d-dl-file').download = dName.replace(/\.ajay$/,'') || 'restored';

    $('d-result').style.display = 'block';
    showMsg(msg, bad ? 'Restored — some key positions did not fit this file.' : 'Restored.', bad ? 'err' : '');
    $('d-run').disabled = false;
  });

  // ---------- RESET ----------
  $('reset').addEventListener('click', ()=>{
    eBytes=null; dBytes=null; eName=''; dName='';
    $('e-file').value=''; $('d-file').value=''; $('d-keyfile').value='';
    $('d-key').value=''; $('e-count').value='500'; $('e-marker').checked = true;
    $('e-datename').checked = false; $('e-part').value = '1';
    document.getElementById('e-part-wrap').classList.remove('show');
    $('e-fname').textContent=''; $('d-fname').textContent='';
    $('e-result').style.display = 'none'; $('d-result').style.display = 'none';
    clearMsg($('e-msg')); clearMsg($('d-msg'));
  });
})();
</script>
</body>
</html>
